name: Tourism Project Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:

  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Register Dataset
        run: python model_building/data_register.py
      - name: Upload Registered Dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: data/tourism.csv

  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Run Data Preparation
        run: python model_building/prep.py
      - name: Upload Train Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            Xtrain.csv
            Xtest.csv
            ytrain.csv
            ytest.csv

  model-training:
    needs: data-prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Download Train Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
      - name: Start MLflow Server
        run: |
          nohup python -m mlflow ui --host 127.0.0.1 --port 5000 > mlflow.log 2>&1 &
          for i in {1..30}; do
            curl -sf http://127.0.0.1:5000/health && break
            sleep 1
          done
      - name: Model Building
        run: python model_building/train.py
      - name: Upload MLflow Logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-logs
          path: mlflow.log
      - name: Commit Trained Model
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deployment/*.joblib
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add trained model [skip ci]"
            git push
          fi
